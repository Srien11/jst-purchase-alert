services:
  purchase-alert:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - alert-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.purchase-alert.rule=Host(`purchase-alert.kktree.cn`) && PathPrefix(`/purchase-alert`)"
      - "traefik.http.routers.purchase-alert.entrypoints=websecure"
      - "traefik.http.routers.purchase-alert.middlewares=purchase-alert-strip"
      - "traefik.http.routers.purchase-alert.tls=true"
      - "traefik.http.routers.purchase-alert.tls.certresolver=myresolver"
      - "traefik.http.middlewares.purchase-alert-strip.stripprefix.prefixes=/purchase-alert"
      - "traefik.http.services.purchase-alert.loadbalancer.server.port=8000"
    networks:
      - traefik-network

volumes:
  alert-data:

networks:
  traefik-network:
    external: true
